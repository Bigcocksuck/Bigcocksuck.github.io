<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Python Code</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #101a3a, #182b5c);
            color: white;
            min-height: 100vh;

            text-align: center;

            font-size: 45px;

        .header p {
            color: #b9c9ff;
            font-size: 18px;
        }

        .date {
            color: #70a6ff;
            font-weight: bold;
        }

        .code-box {
            max-width: 800px;
            margin: 20px auto;
            background: #0b1025;
            border: 2px solid #4d8dff;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
        }

        .top-bar {
            background: #182342;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff5f56;
        }

        .dot:nth-child(2) {
            background: #ffbd2e;
        }

        .dot:nth-child(3) {
            background: #27c93f;
        }

        .filename {
            margin-left: 10px;
            color: #b9c9ff;
            font-weight: bold;
        }

        pre {
            margin: 0;
            padding: 30px;
            font-size: 18px;
            line-height: 1.7;
            overflow-x: auto;
            color: #e6eeff;
        }

        .keyword {
            color: #ff79c6;
        }

        .function {
            color: #50fa7b;
        }

        .button-area {
            text-align: center;
            margin: 30px;
        }

        button,
        .back-button {
            border: none;
            padding: 13px 22px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin: 8px;
        }

        .copy-button {
            background: #4d8dff;
            color: white;
        }

        .copy-button:hover {
            background: #70a6ff;
        }

        .back-button {
            background: #27365f;
            color: white;
        }

        .back-button:hover {
            background: #3c4f80;
        }

        /* Donkeys */

        .donkey {
            position: fixed;
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 20px;
            border: 4px solid #6ea8ff;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
            z-index: -1;
        }

        .donkey1 {
            top: 30px;
            left: 20px;
            transform: rotate(-8deg);
        }

        .donkey2 {
            top: 180px;
            right: 20px;
            transform: rotate(8deg);
        }

        .donkey3 {
            bottom: 30px;
            left: 30px;
            transform: rotate(7deg);
        }

        .donkey4 {
            bottom: 80px;

            transform: rotate(-7deg);
        }

        .donkey5 {
            top: 450px;

        }

        .donkey6 {
            top: 550px;
            right: 5px;
            transform: rotate(12deg);
        }

        .donkey-text {
            text-align: center;
            font-size: 25px;
            margin-top: 20px;
        }

        @media (max-width: 900px) {
            .donkey {
                width: 80px;
                height: 80px;
            }

            .code-box {
                margin: 20px;
            }
        }
    </style>
</head>

<body>

    <!-- Random Donkeys -->

    <div class="code-box">

    <script>

        function copyCode() {

            const code =
                document.getElementById("pythonCode").innerText;

</html>
